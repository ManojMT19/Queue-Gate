<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" width="1040" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="320" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#111827">QueueGate architecture</text>

  <!-- Top row -->
  <rect x="30" y="60" width="170" height="70" rx="10" fill="#e8eef7" stroke="#5b7db1" stroke-width="2"/>
  <text x="115" y="93" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Client</text>
  <text x="115" y="113" font-size="12" text-anchor="middle" fill="#374151">Postman / curl</text>

  <rect x="300" y="60" width="170" height="70" rx="10" fill="#ddebff" stroke="#3b82c4" stroke-width="2"/>
  <text x="385" y="93" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">queue-room</text>
  <text x="385" y="113" font-size="12" text-anchor="middle" fill="#374151">port 8080</text>

  <rect x="570" y="60" width="170" height="70" rx="10" fill="#fff0d9" stroke="#d08a1e" stroke-width="2"/>
  <text x="655" y="93" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Kafka</text>
  <text x="655" y="113" font-size="11" text-anchor="middle" fill="#374151">user-joined, user-admitted</text>

  <rect x="840" y="60" width="170" height="70" rx="10" fill="#e3f5e8" stroke="#3c9a5b" stroke-width="2"/>
  <text x="925" y="93" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">logger-service</text>
  <text x="925" y="113" font-size="12" text-anchor="middle" fill="#374151">port 8081</text>

  <!-- Bottom row -->
  <rect x="300" y="215" width="170" height="70" rx="10" fill="#fbe3e3" stroke="#c54b4b" stroke-width="2"/>
  <text x="385" y="248" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Redis</text>
  <text x="385" y="268" font-size="12" text-anchor="middle" fill="#374151">the line + passes</text>

  <rect x="840" y="215" width="170" height="70" rx="10" fill="#e6e9fb" stroke="#5560c4" stroke-width="2"/>
  <text x="925" y="248" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">PostgreSQL</text>
  <text x="925" y="268" font-size="12" text-anchor="middle" fill="#374151">queue_events history</text>

  <!-- Arrows: top row -->
  <line x1="200" y1="95" x2="298" y2="95" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="85" font-size="12" text-anchor="middle" fill="#374151">HTTP</text>

  <line x1="470" y1="95" x2="568" y2="95" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="85" font-size="12" text-anchor="middle" fill="#374151">events</text>

  <line x1="740" y1="95" x2="838" y2="95" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="790" y="85" font-size="12" text-anchor="middle" fill="#374151">consume</text>

  <!-- Arrows: vertical -->
  <line x1="385" y1="132" x2="385" y2="213" stroke="#4b5563" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="397" y="178" font-size="12" fill="#374151">read / write</text>

  <line x1="925" y1="132" x2="925" y2="213" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="937" y="178" font-size="12" fill="#374151">save history</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
